<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <span class="mark">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="mbg" x1="0" y1="0" x2="0.3" y2="1">
              <stop offset="0" stop-color="#2A3878" />
              <stop offset="1" stop-color="#0A0E2A" />
            </linearGradient>
            <radialGradient id="mglow" cx="0.5" cy="0.6" r="0.55">
              <stop offset="0" stop-color="#EAFBFF" stop-opacity="0.9" />
              <stop offset="1" stop-color="#38BDF8" stop-opacity="0" />
            </radialGradient>
          </defs>
          <rect width="32" height="32" rx="8" fill="url(#mbg)" />
          <ellipse cx="16" cy="19" rx="10" ry="11" fill="url(#mglow)" />
          <path d="M3 6 L10 9 L10 26 L3 29 Z" fill="#4F93F7" />
          <path d="M29 6 L22 9 L22 26 L29 29 Z" fill="#4F93F7" />
          <circle cx="16" cy="13" r="4.4" fill="#F4FDFF" />
          <path d="M10 27 L10 22.5 a6 6 0 0 1 12 0 L22 27 Z" fill="#F4FDFF" />
        </svg>
      </span>
      <span class="titles">
        <span class="name">Auto Admit</span>
        <span class="sub">Zoom Web Client</span>
      </span>
      <span class="status" id="status" data-state="idle">
        <span class="dot"></span>
        <span id="statusText">Checking</span>
      </span>
    </header>

    <section class="stat">
      <div class="stat-main">
        <div class="value" id="admittedCount">0</div>
        <div class="caption">participants admitted</div>
      </div>
      <button class="reset" id="reset" type="button">Reset</button>
    </section>

    <section class="rows">
      <label class="row">
        <span class="row-text">
          <span class="row-title">Auto admit</span>
          <span class="row-sub">Press admit controls as they appear</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="enabled" />
          <span class="track"></span>
          <span class="thumb"></span>
        </span>
      </label>

      <label class="row">
        <span class="row-text">
          <span class="row-title">Prefer "Admit all"</span>
          <span class="row-sub">One press instead of one per person</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="preferAdmitAll" />
          <span class="track"></span>
          <span class="thumb"></span>
        </span>
      </label>

      <label class="row">
        <span class="row-text">
          <span class="row-title">Keep Participants open</span>
          <span class="row-sub">Reopen it when screen sharing closes it</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="keepParticipantsOpen" />
          <span class="track"></span>
          <span class="thumb"></span>
        </span>
      </label>

      <label class="row">
        <span class="row-text">
          <span class="row-title">Console logging</span>
          <span class="row-sub">Log every press to DevTools</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="debug" />
          <span class="track"></span>
          <span class="thumb"></span>
        </span>
      </label>
    </section>

    <section class="attendance-card">
      <span class="attendance-copy">
        <span class="row-title">Attendance</span>
        <span class="row-sub" id="attendanceSummary">No active attendance session</span>
      </span>
      <button class="primary-small" id="openAttendance" type="button">Open</button>
    </section>

    <footer class="foot">
      <button class="ghost" id="dump" type="button">Dump buttons to console</button>
      <p class="hint" id="hint">Open the Participants panel so the waiting-room controls exist in the page.</p>
    </footer>

    <a
      class="credit"
      id="credit"
      href="https://mohamed.hosam.quantara-eg.com/"
      target="_blank"
      rel="noopener noreferrer"
      >Powered by <b>Mohamed Hosam</b></a
    >

    <script src="popup.js"></script>
  </body>
</html>
