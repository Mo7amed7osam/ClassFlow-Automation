# ClassFlow Automation on Coolify.
#
# In Coolify: New Resource -> Docker Compose, this repository, branch Windows_and_web,
# compose path deploy/docker-compose.coolify.yml, base directory the repository root.
# Every value below comes from Coolify's own environment editor; see deploy/.env.example.
#
# Only `backend` is reachable from outside. PostgreSQL and the worker have no published port and no
# domain: the worker connects out to the backend and nothing connects in to it.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set a database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a database password}
      POSTGRES_DB: ${POSTGRES_DB:-classflow}
      # Africa/Cairo everywhere, so a timestamp read in psql matches one read on the dashboard.
      TZ: ${TZ:-Africa/Cairo}
    volumes:
      # A named volume, kept across deployments. Coolify does not remove it when the stack is
      # redeployed; it does when the resource is deleted, so the backup in COOLIFY_DEPLOYMENT.md is
      # not optional.
      - classflow-postgres:/var/lib/postgresql/data
    mem_limit: ${POSTGRES_MEMORY:-1g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CENTRAL_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-classflow}
      # production refuses any request the proxy did not mark as https. That is the right setting
      # behind Coolify's proxy, and the reason CENTRAL_FORWARDED_ALLOW_IPS below must be right.
      CENTRAL_ENVIRONMENT: ${CENTRAL_ENVIRONMENT:-production}
      CENTRAL_FORWARDED_ALLOW_IPS: ${CENTRAL_FORWARDED_ALLOW_IPS:-*}
      CENTRAL_CLIENT_API_KEY_HASHES: ${CENTRAL_CLIENT_API_KEY_HASHES:?the SHA-256 of each n8n key, never a key}
      # 32 random bytes, base64. Losing it makes every stored LMS password unreadable, and changing
      # it does the same, so it is kept with the backups and never only here.
      CENTRAL_SECRETS_KEY: ${CENTRAL_SECRETS_KEY:?set a secrets key}
      CENTRAL_ALLOW_REGISTRATION: ${CENTRAL_ALLOW_REGISTRATION:-false}
      CENTRAL_SESSION_HOURS: ${CENTRAL_SESSION_HOURS:-8}
      CENTRAL_AI_API_KEY: ${CENTRAL_AI_API_KEY:-}
      CENTRAL_AI_MODEL: ${CENTRAL_AI_MODEL:-openai/gpt-4o-mini}
      CENTRAL_AI_BASE_URL: ${CENTRAL_AI_BASE_URL:-https://openrouter.ai/api/v1}
      TZ: ${TZ:-Africa/Cairo}
      # Coolify reads this to route the domain and to get a certificate.
      SERVICE_FQDN_BACKEND: ${SERVICE_FQDN_BACKEND:-}
    expose:
      - "8000"
    labels:
      - coolify.managed=true

  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # The worker talks to the backend the same way anything else does: over its public https
      # address. Not http://backend:8000 - the backend refuses a request that did not arrive over
      # https when CENTRAL_ENVIRONMENT is production, and this keeps one path to test.
      ZAA_BACKEND_URL: ${ZAA_BACKEND_URL:?the backend's https address}
      ZAA_WORKER_NAME: ${ZAA_WORKER_NAME:-cloud-worker-1}
      # Single-use, and only read when the state volume has no device token yet. Clear it from
      # Coolify once the worker has enrolled.
      ZAA_ENROLLMENT_TOKEN: ${ZAA_ENROLLMENT_TOKEN:-}
      ZAA_HEADLESS: ${ZAA_HEADLESS:-true}
      ZAA_TIMEZONE: ${TZ:-Africa/Cairo}
      ZAA_STATE_DIR: /var/lib/classflow
      # The container's own clock. ZAA_TIMEZONE tells the worker what a class time means; this
      # tells everything else - log lines, file times, anything reading local time - so the two
      # cannot disagree about what "19:00" was.
      TZ: ${TZ:-Africa/Cairo}
    volumes:
      # The device token, the browser profiles and the journals. A profile is a signed-in Zoom or
      # LMS session: losing this volume means signing every account in again by hand.
      #
      # ONE WORKER PER VOLUME. This is not a preference. The volume holds this worker's device
      # token and identity, so two containers sharing it are the same device to the backend, both
      # heartbeating as it and both answering for its jobs. They would also share every browser
      # profile, and two Chromiums on one userDataDir corrupt it.
      #
      # So `--scale worker=2` is wrong, and the deployment document no longer says otherwise. A
      # second worker is a second SERVICE with its own volume and its own enrolment token; see
      # COOLIFY_DEPLOYMENT.md.
      - classflow-worker-state:/var/lib/classflow
    # Long enough to close a meeting properly. SIGTERM makes the worker drain: it ends the class's
    # meeting, closes the browser and reports the job. Killed halfway, it leaves the meeting open,
    # the profile locked and the class recorded as failed for a reason that was never about it.
    stop_grace_period: 120s
    # Chromium uses shared memory for page rendering and dies without a readable message on
    # Docker's 64 MB default. This is the most common cause of a browser container that "just
    # crashes"; the worker's preflight checks it and refuses to start rather than crash later.
    shm_size: 1gb
    # A browser has no natural ceiling, and without one a class that goes wrong takes PostgreSQL
    # down with it - which loses every other class too. Raise it once a real machine has been
    # measured; 2 GB holds one class comfortably.
    mem_limit: ${ZAA_WORKER_MEMORY:-2g}
    security_opt:
      # The browser keeps its own sandbox, which needs unprivileged user namespaces. This is the
      # narrow way to allow that; --no-sandbox would be the wide one and is not used.
      - seccomp=unconfined
    labels:
      - coolify.managed=true

volumes:
  classflow-postgres:
    name: classflow-postgres
  classflow-worker-state:
    name: classflow-worker-state
